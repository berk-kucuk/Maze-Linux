# Maze Linux — kernel & network hardening defaults.
# Conservative settings that improve the security posture without breaking
# normal desktop use. Applied automatically by systemd-sysctl from /etc/sysctl.d.

## --- Kernel ---------------------------------------------------------------
# Hide kernel pointers from unprivileged users (defeats some exploit techniques).
kernel.kptr_restrict = 2
# Only root may read the kernel ring buffer (dmesg).
kernel.dmesg_restrict = 1
# Restrict ptrace to child processes only (YAMA) — blocks process snooping.
kernel.yama.ptrace_scope = 1
# Restrict eBPF to privileged users and harden the JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Disallow loading a new kernel via kexec at runtime.
kernel.kexec_load_disabled = 1
# Limit the Magic SysRq key to the safe "secure attention key" subset.
kernel.sysrq = 4
# Don't auto-load TTY line disciplines (shrinks kernel attack surface).
dev.tty.ldisc_autoload = 0
# Faster, more useful core-dump-free behaviour for setuid programs.
fs.suid_dumpable = 0
# Harden hardlink/symlink handling in world-writable dirs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

## --- Network --------------------------------------------------------------
# Enable reverse-path filtering (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# SYN cookies (basic SYN-flood protection).
net.ipv4.tcp_syncookies = 1
# Ignore ICMP redirects (prevents routing-table tampering).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
# Don't act as a router (no redirect sending).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Reject source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Ignore ICMP echo broadcasts (smurf-attack mitigation) and bogus responses.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Log martian (impossible-address) packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
