# Maze Linux live ISO: force Cloudflare DNS (1.1.1.1).
# DHCP-provided resolvers sometimes fail to resolve the Maze package repo
# (mazerepo.berkkucukk.com.tr). With [global-dns-domain-*] set, NetworkManager
# ignores per-connection / DHCP DNS entirely and uses these servers for every
# domain, so the live environment can always reach the Maze repo.
[global-dns-domain-*]
servers=1.1.1.1,1.0.0.1
