# Maze Linux SSH defaults: hardened, but password login stays ENABLED
# (key-based auth isn't practical for every user). Root login is still disabled.
PermitRootLogin no
PasswordAuthentication yes
X11Forwarding no
MaxAuthTries 3
AllowAgentForwarding no
AllowTcpForwarding no
# Extra hardening (lynis SSH-7408) — only matters if the user enables sshd (it is
# disabled by default on installed systems).
MaxSessions 2
ClientAliveCountMax 2
LogLevel VERBOSE
TCPKeepAlive no
