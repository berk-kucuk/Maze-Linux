# archiso default. On the live medium 00-maze-hardening.conf is read first and
# sshd keeps the FIRST value of each keyword, so PermitRootLogin stays "no".
# deploy-to-target.sh deletes this file from the installed system.
# sshd is no longer started on the live medium at all (it was, for archiso's
# remote installs): this file only applies if someone starts it by hand.
# Allow root login using password authentication
PasswordAuthentication yes
PermitRootLogin yes
