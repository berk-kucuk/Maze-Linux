# Maze Linux archiso initramfs.
#
# 'kms' is intentionally REMOVED from the stock archiso HOOKS. Without the
# 'autodetect' hook (a live medium must boot on any machine, so all modules are
# kept), 'kms' runs `add_checked_modules /drivers/gpu/drm/` — i.e. it pulls in
# EVERY GPU driver and, because mkinitcpio bundles each module's firmware, all of
# their firmware too. That was ~141 MB of GPU firmware (nvidia ~105 MB, amdgpu
# ~26 MB, i915/xe/radeon) baked UNCOMPRESSED into the initramfs (firmware ships
# as individually-zstd'd .bin.zst, so it does not recompress), bloating the UKI
# to ~262 MB. On real hardware the firmware/UKI has to be read from the boot
# medium and unpacked on every boot — the reason bare-metal boots crawled while
# VMware (fast virtual media, trivial vmwgfx GPU) flew. Dropping 'kms' loses only
# EARLY KMS: the splash now comes up via simpledrm/efifb (UEFI framebuffer) and
# the real GPU driver still loads normally from the squashfs once the root is
# mounted. Net: initramfs/UKI shrink by ~141 MB and bare-metal boot is far
# faster. If a specific GPU needs early KMS for a flicker-free handoff, re-add
# 'kms' knowingly and accept the size.
HOOKS=(base udev microcode modconf plymouth archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
# zstd instead of xz -9e: the small compressed main cpio decompresses several
# times faster at boot (xz -9e is the slowest to decompress), for a negligible
# size difference. The bulk firmware above was uncompressed regardless, so this
# only ever helped the main cpio — but every bit of early-boot CPU counts.
COMPRESSION="zstd"
