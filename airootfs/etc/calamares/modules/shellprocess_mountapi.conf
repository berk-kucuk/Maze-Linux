# Maze Linux — mount the API/pseudo filesystems into the target.
#
# WHY: Calamares' chroot job runner (used by initcpiocfg/initcpio/bootloader)
# uses a PLAIN chroot, not arch-chroot, so it relies on the `mount` module having
# bind-mounted /dev /proc /sys /run into the target. In the OFFLINE (unpackfs)
# flow those API mounts are not reliably present when mkinitcpio runs, so
# `mkinitcpio` aborts with "==> ERROR: /dev must be mounted!" (and the
# systemd-boot `kernel-install` path fails the same way — same root cause).
#
# This runs UN-chrooted right after unpackfs and does exactly what arch-chroot
# does: rbind /dev (brings /dev/pts, /dev/shm), /sys (brings efivars), /run
# (brings /run/udev), and mount a fresh procfs. Idempotent via mountpoint checks,
# so it's harmless if the mount module already set some of them up. The `umount`
# module at the end of the sequence tears these down with the rest of the target.
---
dontChroot: true
timeout: 120

# The logic is in an external script so Calamares (which substitutes its OWN
# variables in the command string) never tries to expand the script's internal
# $R/$d shell vars. The target root variable is ${ROOT} (NOT @@ROOT@@ — that is
# not a Calamares variable and is passed through literally). Calamares passes the
# substituted root path to the script as $1.
script:
  - command: "/usr/local/share/maze/calamares-mount-api.sh ${ROOT}"
    timeout: 120
