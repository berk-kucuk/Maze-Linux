# Maze Linux — initcpiocfg (mkinitcpio.conf HOOKS writer).
#
# Writes /etc/mkinitcpio.conf on the target with the correct HOOKS for THIS
# install — most importantly the `encrypt` hook (plus `keyboard`/`keymap`) when
# the root is on LUKS, so the initramfs can unlock it at boot. unpackfs copied
# the live (unencrypted) mkinitcpio.conf, which lacks those hooks.
#
# Uses the classic udev/busybox hooks (NOT the systemd sd-encrypt set) to match
# the rest of the Maze boot path: deploy-to-target.sh inserts the `plymouth` hook
# right after `kms` (or after `udev`) and then runs `mkinitcpio -P` exactly once.
---
# Keep mkinitcpio's default modules/binaries/files unless something is needed.
# Empty lists mean "don't touch those arrays" — only HOOKS is computed from the
# partition layout.
