# Maze Linux — welcome page + system requirements.
#
# OFFLINE installer: the base system is copied from the live medium, so internet
# is NOT required to install (it is only needed later, by deploy-to-target.sh, to
# fetch the AUR / [mazelinux] apps — which is best-effort). So 'internet' is
# checked (to warn) but NOT in 'required'.
---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    requiredStorage:    20
    requiredRam:        2.0
    internetCheckUrl:   https://mazelinux.berkkucukk.com.tr
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root
