# Maze Linux — bootloader module.
#
# Installs systemd-boot to the target ESP (mounted at /boot) and writes plain BLS
# loader entries (linux + initrd + options) — NOT a UKI. deploy-to-target.sh then
# appends Maze's kernel params to those entries (it already patches
# /boot/loader/entries/*.conf), regenerates the initramfs (mkinitcpio -P) and
# applies the OLED branding.
#
# NOTE: Secure Boot (shim + per-machine MOK) IS wired in — deploy-to-target.sh's
# setup_secure_boot() signs systemd-boot + the kernels and installs shim. It also
# DELETES the "Linux Boot Manager" NVRAM entry that the `bootctl install` below
# creates: that entry points straight at the UNSIGNED systemd-bootx64.efi, and
# with Secure Boot ON the firmware would boot it and fail validation (MOK only
# counts when shim is in the chain). After cleanup the firmware boots only via
# shim (the "Maze Linux" entry or the removable \EFI\BOOT\BOOTX64.EFI fallback).
---
efiBootLoader: "systemd-boot"

kernel:    "/vmlinuz-linux"
img:       "/initramfs-linux.img"
fallback:  "/initramfs-linux-fallback.img"

kernelSearchPath:  "/usr/lib/modules"
kernelPattern:     "^vmlinuz.*"
kernelName:        "vmlinuz-linux"
initramfsName:     "initramfs-linux.img"

timeout: "5"

# UEFI boot entry id (sanitised); also used for the loader directory.
efiBootloaderId: "Maze"

# Install the bootloader to the EFI removable fallback path (\EFI\BOOT\BOOTX64.EFI)
# as well, so the firmware boots it even on machines that drop NVRAM entries (VMs).
installEFIFallback: true
