# Maze Linux — enable core systemd services on the target.
#
# SDDM is enabled by the displaymanager module; NetworkManager is the Maze net
# stack (deploy-to-target also re-enables a fuller set, but enabling NM here
# guarantees networking on first boot even if deploy-to-target is interrupted).
# The bulk of Maze services are enabled by deploy-to-target.sh.
---
services:
    - name: NetworkManager
      mandatory: false

targets:
    - name: graphical
      mandatory: true

disable: []
