# Maze Linux — users module.
#
# Creates the real user from the Users page (after removeuser has dropped the
# live 'maze' account that unpackfs copied in). wheel = sudo group; Calamares
# writes a password-required sudoers file for it (the live medium's NOPASSWD
# /etc/sudoers.d/10-maze is removed on the target by deploy-to-target.sh).
#
# Login shell is zsh to match the Maze desktop (deploy-to-target also enforces
# this, but setting it here means the very first login is already zsh).
---
defaultGroups:
    - users
    - lp
    - video
    - network
    - storage
    - wheel
    - audio
    - power
    - rfkill
    - sys

autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
setRootPassword:  false
doReusePassword:  true

userShell: /usr/bin/zsh

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=2

# Require STRONG passwords by DEFAULT (the "require strong passwords" box is
# ticked on first show). allowWeakPasswords keeps the box available so a user who
# really wants a weak password can untick it — but they have to opt out.
allowWeakPasswords: true
allowWeakPasswordsDefault: false
