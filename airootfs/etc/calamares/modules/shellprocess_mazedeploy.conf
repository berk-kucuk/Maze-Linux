# Maze Linux finalisation — run deploy-to-target.sh on the installed target.
#
# deploy-to-target.sh runs in the LIVE environment (where /etc/skel, the Maze
# branding assets and the live config all exist) and does its own arch-chroot
# into the target. So this runs UN-chrooted, passing the target root that
# Calamares mounted as the first argument (the ${ROOT} variable).
#
# Args (same contract as the archinstall path):
#   $1 = target mountpoint            -> ${ROOT}
#   $2 = selected Maze apps CSV       -> '' (empty = all, the Maze default)
#   $3 = selected security CSV        -> '' (empty = all, the Maze default)
#
# It is the slowest step (it builds/install AUR apps and the [mazelinux] apps
# with network), hence the long timeout.
---
dontChroot: true
timeout: 9000

script:
  # ${ROOT} is the Calamares target-mountpoint variable (NOT @@ROOT@@, which is
  # not substituted and would be passed literally).
  # $2 = "all"  -> install the full default Maze app set from [mazelinux].
  # $3 = ""     -> all security features (empty CSV = all, the Maze default).
  - command: "/usr/share/maze/install/deploy-to-target.sh ${ROOT} 'all' ''"
    timeout: 9000
