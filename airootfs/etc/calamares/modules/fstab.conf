# Maze Linux — fstab module.
#
# Writes /etc/fstab and /etc/crypttab on the target. Per-filesystem mount options
# come from the mount module (mount.conf); here we only set the ESP and crypttab
# options. crypttab uses "luks" (the LUKS keyfile that luksbootkeyfile sets up so
# the passphrase is typed only once at boot).
---
efiMountOptions: defaults,umask=0077
crypttabOptions: luks
