# Maze Linux — unpackfs (OFFLINE install).
#
# Copies the already-built live Maze system onto the freshly-partitioned target,
# instead of running pacstrap. The source is the live medium's squashfs image.
# Path layout from profiledef.sh: install_dir=maze, arch=x86_64 -> the airootfs
# image lives at  /run/archiso/bootmnt/<install_dir>/<arch>/airootfs.sfs.
#
# (Grounded in EndeavourOS's offline config, which uses the identical
#  /run/archiso/bootmnt/<dir>/x86_64/airootfs.sfs path; only the dir differs.)
#
# VERIFY ON FIRST VM BOOT: from a booted live session run
#   ls -l /run/archiso/bootmnt/maze/x86_64/airootfs.sfs
# and adjust this path if archiso changes the layout.
# NOTE: the top-level key is `unpack` (NOT `unpackfs`); the wrong key makes
# Calamares report "Bad unpackfs configuration / no configuration information".
---
unpack:
    - source: "/run/archiso/bootmnt/maze/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
