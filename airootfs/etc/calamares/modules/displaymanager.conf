# Maze Linux — display manager module.
#
# Maze ships SDDM (with the maze-oled theme, configured in /etc/sddm.conf.d/
# 20-maze-theme.conf). basicSetup=false leaves the sddm user/group to the package
# (already present in the copied live system).
---
displaymanagers:
    - sddm

basicSetup: false
sysconfigSetup: false
