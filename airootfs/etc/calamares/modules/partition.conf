# Maze Linux — partition module.
#
# Maze layout: a FAT32 EFI System Partition mounted at /boot (holds the kernel,
# initramfs and the systemd-boot loader — the classic Arch systemd-boot layout)
# and a btrfs root. LUKS is offered (luks2). Disk swap is off by default because
# Maze uses zram swap (zram-generator, configured by deploy-to-target.sh).
---
# Mount the ESP at /boot so the kernel/initramfs and systemd-boot live together.
efiSystemPartition:     "/boot"

# Generous ESP: /boot here holds vmlinuz + initramfs (+ fallback) for one or more
# kernels, so 1 GiB avoids "no space on ESP" on kernel updates.
efiSystemPartitionSize:     1GiB
efiSystemPartitionName:     ESP

# Swap choices. zram (RAM-compressed) is the everyday swap (set up by
# deploy-to-target). Disk-swap choices are "file" and "none".
#
# NOTE: the "suspend" choice (a RAM-sized swap PARTITION for hibernate) is NOT
# offered. On an ENCRYPTED install it makes Calamares add the `openswap`
# mkinitcpio hook to unlock the separate encrypted swap — but that hook does not
# exist on Arch (it's a Manjaro/CachyOS package: mkinitcpio-openswap), so
# `mkinitcpio` aborts with "Hook 'openswap' cannot be found" and the install
# FAILS. Proper hibernate-on-LUKS needs that hook + the luksopenswaphookcfg
# module + resume wiring — a deliberate, tested feature to add later, not a swap
# choice we can flip on blindly.
userSwapChoices:
    - none
    - file

# btrfs by default (subvolume layout + compression handled by the mount module).
defaultFileSystemType:  "btrfs"
availableFileSystemTypes:
    - "btrfs"
    - "ext4"

# Modern LUKS for full-disk encryption.
luksGeneration:  luks2

drawNestedPartitions:   false
alwaysShowPartitionLabels:  true
allowManualPartitioning:    true

initialPartitionAttributes: []
