# Maze Linux honeypot (deception layer) behaviour.
#
# AUTO_LOCKDOWN=1 cuts ALL network (rfkill block all) the instant a canary is
# touched. It is OFF by default so a false positive can never lock you out of
# your own machine; turn it on for high-threat scenarios.
AUTO_LOCKDOWN=0

# NOTIFY=1 shows a desktop notification to every logged-in user on a trigger.
NOTIFY=1
