# Maze Sentinel — host security anomaly monitor behaviour.
#
# Sentinel replaces the old honeypot/deception layer. Rather than planting fake
# "canary" files (which normal tools kept reading, causing false alarms), it
# watches for REAL, rare, security-relevant changes and, when one happens, shows
# a clear desktop notification explaining what changed and what to do.

# Show desktop notifications (1) or only log to /var/log/maze-sentinel.log (0).
NOTIFY=1

# Seconds between the background scans for new root-privileged (SUID/SGID) programs
# and new root (UID 0) accounts. Lower = faster detection, slightly more CPU.
SCAN_INTERVAL=600

# Collapse repeated audit events from a single action (e.g. one `useradd` writes
# /etc/passwd several times) into ONE notification, per change-type, within this
# many seconds.
DEBOUNCE=15

# Writers whose changes are EXPECTED because YOU ran them (installing/updating
# software legitimately edits these files). Their events are logged but never
# alerted. Note: the audit log truncates process names to 15 characters.
BENIGN_WRITERS="pacman paru makepkg yay pikaur systemd-sysuser systemd-tmpfile"

# Directories scanned for new SUID/SGID-root programs. A whole-filesystem scan is
# too slow; these are where such binaries virtually always live.
SUID_SCAN_DIRS="/usr/bin /usr/local/bin /usr/sbin /bin /sbin"
