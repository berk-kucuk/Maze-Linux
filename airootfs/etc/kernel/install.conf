# Maze Linux — kernel-install layout.
#
# Forces `kernel-install` (called by Calamares' bootloader module AND by
# deploy-to-target.sh's later `kernel-install add`) to build a native Unified
# Kernel Image straight to $ESP/EFI/Linux/<machine-id>-<kver>.efi instead of a
# plain BLS entry (loose vmlinuz + initrd + loader/entries/*.conf). This must
# ship as a static file present before unpackfs finishes, so it is already
# active the moment Calamares' `bootloader` module runs — no plain-BLS
# artifacts are ever written, so deploy-to-target.sh never needs to convert
# anything after the fact (it only re-signs the UKI kernel-install already
# built).
layout=uki
