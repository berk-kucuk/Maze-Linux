# Maze Linux: give plasmashell 5 s to quit instead of Plasma's 40 s.
#
# On logout/poweroff plasmashell regularly hangs on SIGTERM (main thread and
# its KIO worker threads stuck in a futex wait), so every shutdown sat on
# "A stop job is running for User Manager" for the full 40 s before systemd
# SIGKILLed it. A healthy plasmashell quits in ~0.3 s and writes its config as
# it changes, so 5 s loses nothing — it only shortens the wait for the hang.
# Root cause still open; remove this once plasmashell exits cleanly again.
[Service]
TimeoutStopSec=5s
