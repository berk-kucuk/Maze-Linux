# Maze Linux — compressed RAM swap (zram) via systemd zram-generator.
# A zstd-compressed swap device in RAM improves responsiveness under memory
# pressure and avoids hammering the disk. Sized 1:1 with RAM (the zram device is
# advertised as RAM-sized; being zstd-compressed it only consumes a fraction of
# physical RAM for the data actually swapped in).
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
