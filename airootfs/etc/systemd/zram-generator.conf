# Maze Linux — compressed RAM swap (zram) via systemd zram-generator.
# A zstd-compressed swap device in RAM improves responsiveness under memory
# pressure and avoids hammering the disk. Sized at half of RAM, capped at 8 GiB.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
