# Vestigial boot entry — at runtime shim directly chainloads the UKI (grubx64.efi)
# and never reads systemd-boot entries. The kernel + initramfs referenced below
# are also deleted from the ESP by _maze_sb_sign_esp(). This file exists only
# because archiso requires loader entries for the uefi.systemd-boot buildmode.
# See efiboot/loader/loader.conf for details.
title    Maze Linux install medium (%ARCH%, UEFI)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash bgrt_disable logo.nologo lsm=landlock,lockdown,yama,integrity,apparmor,bpf apparmor=1 security=apparmor
