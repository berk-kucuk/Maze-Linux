# NOTE: This systemd-boot loader configuration is vestigial at runtime.
# During the build, _maze_sb_sign_esp() (in build.sh) replaces the entire ESP
# layout: systemd-boot is deleted and shim is installed as BOOTx64.EFI, which
# directly chainloads the Maze-signed Unified Kernel Image (grubx64.efi).
# The boot chain is: firmware -> shim -> UKI -> kernel.
# systemd-boot and these loader entries are never consulted at boot time.
# archiso still requires this directory to exist for the uefi.systemd-boot
# buildmode, so the files must be kept despite being unused post-build.
timeout 15
default 01-archiso-linux.conf
beep on
# Keep the firmware's POST framebuffer mode (the panel's native resolution).
# Do NOT use `console-mode max`: on most UEFI firmware the highest GOP mode it
# advertises is a small fallback (often 1024x768), so forcing "max" actually
# DOWNGRADES the console from native and leaves Plymouth stuck at that low res
# on every monitor. `keep` makes systemd-boot leave the native mode the
# firmware already set, which is what we want for a seamless splash handoff.
console-mode keep
