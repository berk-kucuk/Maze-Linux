<template>
  <style>
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-style: normal; src: url("assets/fonts/JetBrainsMono-600.woff2") format("woff2"); }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      color: #ffffff;
    }

    /* full-bleed ground — a clip layer, never the root */
    [id="03-foundation-ground"] {
      position: absolute;
      inset: 0;
      background: #000000;
    }

    /* content layer + camera group (scale-only breath per beat) */
    [id="03-foundation-stage"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    [id="03-foundation-cam"] {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* triptych hairlines */
    [id="03-foundation-rule-a"],
    [id="03-foundation-rule-b"] {
      position: absolute;
      top: 0;
      width: 1px;
      height: 1080px;
      background: #1A2022;
    }
    [id="03-foundation-rule-a"] { left: 640px; }
    [id="03-foundation-rule-b"] { left: 1280px; }

    /* columns */
    [id="03-foundation-col-1"],
    [id="03-foundation-col-2"],
    [id="03-foundation-col-3"] {
      position: absolute;
      top: 0;
      width: 640px;
      height: 1080px;
    }
    [id="03-foundation-col-1"] { left: 0; }
    [id="03-foundation-col-2"] { left: 640px; }
    [id="03-foundation-col-3"] { left: 1280px; }

    /* glyphs — 117px square, 1px strokes on half-pixel centres */
    [id="03-foundation-glyph-1"],
    [id="03-foundation-glyph-2"],
    [id="03-foundation-glyph-3"] {
      position: absolute;
      left: 261px;
      top: 296px;
      width: 117px;
      height: 117px;
      display: block;
      overflow: visible;
    }
    [id="03-foundation-glyph-2"],
    [id="03-foundation-glyph-3"] { opacity: 0; }
    [id="03-foundation-glyph-1"] path,
    [id="03-foundation-glyph-2"] path,
    [id="03-foundation-glyph-3"] path {
      fill: none;
      stroke: #3E4547;
      stroke-width: 1;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
    [id="03-foundation-lock-inner"],
    [id="03-foundation-shield-rule"] { stroke: #FFFFFF; }

    /* words — h2 role (500, -0.02em), fit-to-measure at 68px for the 640px column */
    [id="03-foundation-word-1"],
    [id="03-foundation-word-2"],
    [id="03-foundation-word-3"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 449px;
      text-align: center;
      font-size: 68px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #FFFFFF;
      opacity: 0.28; /* ghost state; the lit column is raised to 1 by the timeline */
    }
    [id="03-foundation-line-1a"],
    [id="03-foundation-line-2a"],
    [id="03-foundation-line-2b"],
    [id="03-foundation-line-3a"] {
      display: block;
      will-change: transform, opacity;
    }

    /* labels — the frame's single cyan element, one visible at a time */
    [id="03-foundation-label-1"],
    [id="03-foundation-label-2"],
    [id="03-foundation-label-3"] {
      position: absolute;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #00E5FF;
      opacity: 0;
      will-change: transform, opacity;
    }
    [id="03-foundation-label-1"] { top: 550px; }
    [id="03-foundation-label-2"] { top: 625px; }
    [id="03-foundation-label-3"] { top: 550px; }
  </style>

  <div id="root" data-composition-id="03-foundation" data-width="1920" data-height="1080">
    <div id="03-foundation-ground" class="clip" data-start="0" data-duration="2.4" data-track-index="0"></div>

    <div id="03-foundation-stage" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
      <div id="03-foundation-cam">
        <div id="03-foundation-rule-a"></div>
        <div id="03-foundation-rule-b"></div>

        <!-- BEAT 1 — LUKS2 / disk — lock: outer hint square, inner white square -->
        <div id="03-foundation-col-1">
          <svg id="03-foundation-glyph-1" viewBox="0 0 117 117" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="03-foundation-lock-outer" d="M 0.5 0.5 H 116.5 V 116.5 H 0.5 Z" />
            <path id="03-foundation-lock-inner" d="M 28.5 28.5 H 88.5 V 88.5 H 28.5 Z" />
          </svg>
          <div id="03-foundation-word-1"><span id="03-foundation-line-1a">LUKS2</span></div>
          <div id="03-foundation-label-1">disk</div>
        </div>

        <!-- BEAT 2 — Secure Boot UKI / boot — shield: two vertical hairlines bridged by one white rule -->
        <div id="03-foundation-col-2">
          <svg id="03-foundation-glyph-2" viewBox="0 0 117 117" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="03-foundation-shield-left" d="M 0.5 0.5 V 116.5" />
            <path id="03-foundation-shield-right" d="M 116.5 0.5 V 116.5" />
            <path id="03-foundation-shield-rule" d="M 0.5 46.5 H 116.5" />
          </svg>
          <div id="03-foundation-word-2"><span id="03-foundation-line-2a">Secure Boot</span><span id="03-foundation-line-2b">UKI</span></div>
          <div id="03-foundation-label-2">boot</div>
        </div>

        <!-- BEAT 3 — nftables / network — lattice: 4x4 hint-grey grid -->
        <div id="03-foundation-col-3">
          <svg id="03-foundation-glyph-3" viewBox="0 0 117 117" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="03-foundation-lat-v0" d="M 0.5 0.5 V 116.5" />
            <path id="03-foundation-lat-v1" d="M 29.5 0.5 V 116.5" />
            <path id="03-foundation-lat-v2" d="M 58.5 0.5 V 116.5" />
            <path id="03-foundation-lat-v3" d="M 87.5 0.5 V 116.5" />
            <path id="03-foundation-lat-v4" d="M 116.5 0.5 V 116.5" />
            <path id="03-foundation-lat-h0" d="M 0.5 0.5 H 116.5" />
            <path id="03-foundation-lat-h1" d="M 0.5 29.5 H 116.5" />
            <path id="03-foundation-lat-h2" d="M 0.5 58.5 H 116.5" />
            <path id="03-foundation-lat-h3" d="M 0.5 87.5 H 116.5" />
            <path id="03-foundation-lat-h4" d="M 0.5 116.5 H 116.5" />
          </svg>
          <div id="03-foundation-word-3"><span id="03-foundation-line-3a">nftables</span></div>
          <div id="03-foundation-label-3">network</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    (function () {
      var ID = "03-foundation";
      var $ = function (suffix) { return document.getElementById(ID + "-" + suffix); };

      var DURATION = 2.4;
      var BEAT = 0.8;
      var EASE = "power3.inOut";
      var TEXT_EASE = "power3.out";
      var TEXT_DUR = 0.32;
      var RISE = 24;
      var STAGGER = 0.06;

      var cam = $("cam");

      // svg-path-draw setup: measured lengths, dash fully offset (invisible) until drawn
      var drawIds = [
        "lock-outer", "lock-inner",
        "shield-left", "shield-right", "shield-rule",
        "lat-v0", "lat-v1", "lat-v2", "lat-v3", "lat-v4",
        "lat-h0", "lat-h1", "lat-h2", "lat-h3", "lat-h4"
      ];
      drawIds.forEach(function (s) {
        var p = $(s);
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: DURATION }, 0); // full-span anchor

      function draw(suffix, dur, at) {
        tl.to($(suffix), { strokeDashoffset: 0, duration: dur, ease: EASE }, at);
      }
      function rise(el, at, first) {
        tl.fromTo(
          el,
          { y: RISE, opacity: 0 },
          { y: 0, opacity: 1, duration: TEXT_DUR, ease: TEXT_EASE, immediateRender: !!first },
          at
        );
      }
      function breath(at, first) {
        tl.fromTo(
          cam,
          { scale: 1.0 },
          { scale: 1.03, duration: BEAT, ease: EASE, immediateRender: !!first },
          at
        );
      }

      /* ---------- BEAT 1 (0.0–0.8): LEFT column lit ---------- */
      var b1 = 0;
      tl.set($("word-1"), { opacity: 1 }, b1);
      breath(b1, true);
      draw("lock-outer", 0.40, b1 + 0.00);
      draw("lock-inner", 0.32, b1 + 0.30);
      rise($("line-1a"), b1 + 0.10, true);
      rise($("label-1"), b1 + 0.10 + STAGGER, true);

      /* ---------- BEAT 2 (0.8–1.6): hard cut — CENTER column lit ---------- */
      var b2 = BEAT;
      tl.set($("glyph-1"), { opacity: 0 }, b2);
      tl.set($("label-1"), { opacity: 0 }, b2);
      tl.set($("word-1"), { opacity: 0.28 }, b2);
      tl.set($("glyph-2"), { opacity: 1 }, b2);
      tl.set($("word-2"), { opacity: 1 }, b2);
      breath(b2, false);
      draw("shield-left", 0.36, b2 + 0.00);
      draw("shield-right", 0.36, b2 + 0.08);
      draw("shield-rule", 0.30, b2 + 0.28);
      rise($("line-2a"), b2 + 0.10, false);
      rise($("line-2b"), b2 + 0.10 + STAGGER, false);
      rise($("label-2"), b2 + 0.10 + STAGGER * 2, false);

      /* ---------- BEAT 3 (1.6–2.4): hard cut — RIGHT column lit, runs into the cut to 04 ---------- */
      var b3 = BEAT * 2;
      tl.set($("glyph-2"), { opacity: 0 }, b3);
      tl.set($("label-2"), { opacity: 0 }, b3);
      tl.set($("word-2"), { opacity: 0.28 }, b3);
      tl.set($("glyph-3"), { opacity: 1 }, b3);
      tl.set($("word-3"), { opacity: 1 }, b3);
      breath(b3, false);
      var i;
      for (i = 0; i < 5; i++) draw("lat-v" + i, 0.30, b3 + 0.00 + i * 0.05);
      for (i = 0; i < 5; i++) draw("lat-h" + i, 0.30, b3 + 0.15 + i * 0.05);
      rise($("line-3a"), b3 + 0.10, false);
      rise($("label-3"), b3 + 0.10 + STAGGER, false);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
