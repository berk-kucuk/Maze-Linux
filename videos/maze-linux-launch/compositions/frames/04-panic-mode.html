<template>
  <style>
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-style: normal; src: url("assets/fonts/JetBrainsMono-600.woff2") format("woff2"); }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "JetBrains Mono", monospace;
      color: #FFFFFF;
    }
    #root * { box-sizing: border-box; margin: 0; padding: 0; }

    .clip { position: absolute; inset: 0; }

    /* ground — full-bleed OLED black on the lowest track */
    [id="04-panic-mode-ground"] { background: #000000; }

    /* Scene 1 — the lit screen: crisp front-plane grid, 154px cells, hint-grey lines.
       GSAP owns opacity + scale (no CSS transform here). */
    [id="04-panic-mode-grid"] { opacity: 0.6; transform-origin: 50% 50%; }
    [id="04-panic-mode-grid-lines"] {
      position: absolute;
      inset: -160px;
      background-image:
        linear-gradient(#3E4547 1px, transparent 1px),
        linear-gradient(90deg, #3E4547 1px, transparent 1px);
      background-size: 154px 154px;
      background-position: 1120px 700px;
    }

    /* the type plane — carries the constant push-in (scale 1.00 -> 1.03) */
    [id="04-panic-mode-stage"] { transform-origin: 50% 50%; }

    /* kicker: label role — 500, 0.14em, uppercase, the frame's one cyan element.
       Centered by a full-width wrapper so the word spans stay transform-free for GSAP. */
    [id="04-panic-mode-kicker"] {
      position: absolute;
      left: 0;
      right: 0;
      top: 30%;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      color: #00E5FF;
      white-space: nowrap;
    }

    /* statement lines: quote-text role — 400, -0.02em, 1.15 */
    [id="04-panic-mode-lines"] {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    [id="04-panic-mode-line1"],
    [id="04-panic-mode-line2"] {
      font-size: 72px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #FFFFFF;
      text-align: center;
      white-space: nowrap;
    }

    /* word fragments: inline-block so y-translate applies; start hidden (fromTo restores under seek) */
    [id="04-panic-mode-stage"] .w {
      display: inline-block;
      opacity: 0;
      will-change: transform, opacity;
    }
  </style>

  <div
    id="root"
    data-composition-id="04-panic-mode"
    data-start="0"
    data-duration="3"
    data-width="1920"
    data-height="1080"
  >
    <!-- track 0 — full-bleed black ground -->
    <div id="04-panic-mode-ground" class="clip" data-start="0" data-duration="3" data-track-index="0"></div>

    <!-- track 1 — the lit grid that collapses to black (Scene 1) -->
    <div id="04-panic-mode-grid" class="clip" data-start="0" data-duration="3" data-track-index="1">
      <div id="04-panic-mode-grid-lines"></div>
    </div>

    <!-- track 2 — the type plane under the push-in (Scenes 2–5) -->
    <div id="04-panic-mode-stage" class="clip" data-start="0" data-duration="3" data-track-index="2">
      <div id="04-panic-mode-kicker"><span class="w">Panic</span> <span class="w">Mode</span></div>
      <div id="04-panic-mode-lines">
        <div id="04-panic-mode-line1"><span class="w">Network</span> <span class="w">severed.</span></div>
        <div id="04-panic-mode-line2"><span class="w">RAM</span> <span class="w">wiped.</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04-panic-mode";
      var grid = '[id="' + ID + '-grid"]';
      var stage = '[id="' + ID + '-stage"]';
      var kicker = '[id="' + ID + '-kicker"] .w';
      var line1 = '[id="' + ID + '-line1"]';
      var line1w = line1 + " .w";
      var line2w = '[id="' + ID + '-line2"] .w';

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.25s) — brightness collapse: the lit grid drops to black.
      // Two plain fromTo tweens so t=0 shows the lit grid under seek.
      tl.fromTo(grid, { opacity: 0.6 }, { opacity: 0, duration: 0.25, ease: "power3.in" }, 0);
      tl.fromTo(grid, { scale: 1.0 }, { scale: 0.985, duration: 0.25, ease: "power3.in" }, 0);

      // Camera — the film's constant breath: one push-in end-to-end, never restarting.
      tl.fromTo(stage, { scale: 1.0 }, { scale: 1.03, duration: 3.0, ease: "power3.inOut" }, 0);

      // Scene 2 (0.5–0.9s) — kicker rises at the 30% line: 24px below, 0.06s per word.
      tl.fromTo(
        kicker,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 },
        0.5
      );

      // Scene 3 (1.0–1.4s) — "Network severed." rises into center.
      tl.fromTo(
        line1w,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 },
        1.0
      );

      // Scene 4 (1.8–2.2s) — "RAM wiped." rises directly beneath (waterfall-entry, brief's
      // 24px / opacity form); as it lands, line 1 settles to cream-muted (opacity 0.55).
      tl.fromTo(
        line2w,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 },
        1.8
      );
      tl.fromTo(line1, { opacity: 1 }, { opacity: 0.55, duration: 0.4, ease: "power3.inOut" }, 1.8);

      // Scene 5 (2.2–3.0s) — held read under the push-in. No exit.

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
</template>
