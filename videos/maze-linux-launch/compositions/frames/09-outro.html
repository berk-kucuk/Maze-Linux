<template>
  <div id="root" data-composition-id="09-outro">
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-style: normal;
        src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        font-style: normal;
        src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 600;
        font-style: normal;
        src: url("assets/fonts/JetBrainsMono-600.woff2") format("woff2");
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "JetBrains Mono", monospace;
        color: #ffffff;
      }

      /* ---- ground: full-bleed OLED black, its own clip layer ---- */
      #\30 9-outro-ground {
        position: absolute;
        inset: 0;
        background: #000000;
      }

      /* ---- stage clip + camera (the film's constant breath) ---- */
      #\30 9-outro-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #\30 9-outro-camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* back plane — blurred, scaled, dimmed; handoff-identical to 08 */
      #\30 9-outro-back {
        position: absolute;
        inset: 0;
        filter: blur(8px);
        transform: scale(1.04);
        opacity: 0.35;
        pointer-events: none;
      }
      #\30 9-outro-grid {
        position: absolute;
        left: -308px; /* 2 × 154px: pattern origin stays phase-locked to the frame origin */
        top: -308px;
        width: 2536px; /* 1920 + 2×308 */
        height: 1696px; /* 1080 + 2×308 */
        background-image:
          linear-gradient(#1a2022 1px, transparent 1px),
          linear-gradient(90deg, #1a2022 1px, transparent 1px);
        background-size: 154px 154px;
        background-position: 0 0;
        will-change: transform;
      }

      /* front plane — crisp */
      #\30 9-outro-front {
        position: absolute;
        inset: 0;
      }
      #\30 9-outro-logo {
        position: absolute;
        left: 50%;
        top: 475px; /* 44% of 1080 */
        width: 580px; /* ~30% of frame width; 669×373 → 580×323 */
        height: auto;
        margin-left: -290px;
        margin-top: -162px;
        display: block;
      }

      /* URL line — `lead` role: 1.6cqw ≈ 31px, 400, muted */
      #\30 9-outro-url {
        position: absolute;
        left: 50%;
        top: 675px; /* logo bottom (637) + 38px gap */
        width: calc(27ch + 25px); /* widest state + caret gap + caret — no right-edge jitter */
        margin-left: calc((27ch + 25px) / -2);
        font-family: "JetBrains Mono", monospace;
        font-size: 31px;
        font-weight: 400;

        white-space: pre;

      #\30 9-outro-caret {
        display: inline-block;
        width: 17px;

        margin-left: 8px;
        vertical-align: -5px;
        background: #00e5ff; /* the frame's one cyan element */
        opacity: 0;
      }
    </style>

    <div id="09-outro-ground" class="clip" data-start="0" data-duration="2.8" data-track-index="0"></div>

    <div id="09-outro-stage" class="clip" data-start="0" data-duration="2.8" data-track-index="1">
      <div id="09-outro-camera">
        <div id="09-outro-back">
          <div id="09-outro-grid"></div>
        </div>
        <div id="09-outro-front">
          <img id="09-outro-logo" src="assets/maze-logo.png" alt="" />
          <div id="09-outro-url">
            <span id="09-outro-text"></span><span id="09-outro-caret"></span>
          </div>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DURATION = 2.8;
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["09-outro"] = tl;

        var camera = document.getElementById("09-outro-camera");
        var grid = document.getElementById("09-outro-grid");
        var textEl = document.getElementById("09-outro-text");
        var caretEl = document.getElementById("09-outro-caret");

        /* ---- camera: one continuous push-in, 1.00 → 1.03, end-to-end ---- */
        tl.fromTo(
          camera,
          { scale: 1.0 },
          { scale: 1.03, duration: DURATION, ease: "power3.inOut" },
          0
        );

        /* ---- grid drift: handoff_in (−77,−77) at t=0, constant (−12px/s, −12px/s) ---- */
        tl.fromTo(
          grid,
          { x: -77, y: -77 },
          { x: -77 - 12 * DURATION, y: -77 - 12 * DURATION, duration: DURATION, ease: "none" },
          0
        );

        /* ---- Scene 2 (0.8–1.6s): URL types character by character ----
           discrete-text-sequence: sparse {t, text} states, reverse-searched each frame.
           Keystroke intervals are non-uniform (the dots dwell a beat longer). */
        var URL = "mazelinux.berkkucukk.com.tr";
        var T_TYPE_START = 0.8;
        var SEQUENCE = [{ t: 0, text: "" }];
        (function () {
          var t = T_TYPE_START;
          for (var i = 0; i < URL.length; i++) {
            SEQUENCE.push({ t: t, text: URL.substring(0, i + 1) });
            var ch = URL.charAt(i);
            var next = URL.charAt(i + 1);
            /* dwell after a dot, and a hair longer before one */
            t += ch === "." ? 0.045 : next === "." ? 0.033 : 0.027;
          }
        })();
        var T_TYPE_END = SEQUENCE[SEQUENCE.length - 1].t; /* ≈ 1.58s */

        function textAt(time) {
          for (var i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
          }
          return "";
        }

        /* ---- caret: context-sensitive-cursor, single (brand) segment.
           Visibility is a pure function of timeline time (seek-safe):
             t <  0.8         hidden   (Scene 1: nothing but the logo)
             0.8 ≤ t < 1.6    solid    (typing — no blink while letters land)
             1.6 ≤ t < 2.6    square wave, exactly two cycles of 0.5s (blinks twice)
             t ≥ 2.6          solid hold to the final frame */
        var T_BLINK_START = 1.6;
        var BLINK_PERIOD = 0.5;
        var BLINK_CYCLES = 2; /* whole number — finite, ends on a clean edge */
        var T_BLINK_END = T_BLINK_START + BLINK_PERIOD * BLINK_CYCLES; /* 2.6 */

        function caretOpacityAt(time) {
          if (time < T_TYPE_START) return 0;
          if (time < T_BLINK_START) return 1;
          if (time >= T_BLINK_END) return 1;
          var p = ((time - T_BLINK_START) / BLINK_PERIOD) * Math.PI * 2;
          return Math.sin(p) >= 0 ? 1 : 0;
        }

        /* one linear clock drives both the text state and the caret gate */
        var driver = { t: 0 };
        function render() {
          textEl.textContent = textAt(driver.t);
          caretEl.style.opacity = String(caretOpacityAt(driver.t));
          caretEl.style.background = "#00e5ff";
        }
        render();
        tl.to(
          driver,
          { t: DURATION, duration: DURATION, ease: "none", onUpdate: render },
          0
        );
      })();
    </script>
  </div>
</template>
