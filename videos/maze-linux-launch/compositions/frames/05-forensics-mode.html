<template>
  <style>
    @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal; src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-style: normal; src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 600; font-style: normal; src: url("assets/fonts/JetBrainsMono-600.woff2") format("woff2"); }

    /* Root: styled by #root only (never a class). Container law: every cqw is measured against it. */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "JetBrains Mono", monospace;
      color: #FFFFFF;
    }
    #root * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── track 0: full-bleed OLED-black ground (a clip layer, never #root) ── */
    [id="05-forensics-mode-ground"] {
      position: absolute;
      inset: 0;
      background: #000000;
    }

    /* ── track 1: front plane (crisp) — the whole plane rides the lateral camera pan ── */
    [id="05-forensics-mode-front"] {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    [id="05-forensics-mode-cam"] {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    /* kicker — label role: 500, 0.14em, uppercase; cyan until the first cell lights */
    [id="05-forensics-mode-kicker"] {
      position: absolute;
      left: 6cqw;
      top: 6cqw;
      font-size: 1.1cqw;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      color: #00E5FF;
      white-space: nowrap;
    }
    .fm05-w {
      display: inline-block;
      will-change: transform, opacity;
    }
    .fm05-w + .fm05-w { margin-left: 0.6em; }

    /* centred column: cells row → label → disk */
    [id="05-forensics-mode-col"] {
      position: absolute;
      inset: 0;
      padding-bottom: 5cqw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.4cqw;
    }

    /* eight memory cells — ~43cqw of frame width, 1px hint-grey outlines */
    [id="05-forensics-mode-cells"] {
      display: flex;
      gap: 1.1cqw;
    }
    .fm05-cell {
      position: relative;
      width: 4.4cqw;
      height: 6.2cqw;
      border: 1px solid #3E4547;
    }
    /* the tick — a cyan bar seated at the base of the cell; width:100% is required, GSAP only scales it */
    .fm05-fill {
      position: absolute;
      left: 1.1cqw;
      right: 1.1cqw;
      bottom: 1.1cqw;
      width: calc(100% - 2.2cqw);
      height: 0.7cqw;
      background: #00E5FF;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    /* label — h3 role: 2.8cqw, 600, lh 1.2, cream */
    [id="05-forensics-mode-label"] {
      font-size: 2.8cqw;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      white-space: nowrap;
    }
    [id="05-forensics-mode-label"] .fm05-w + .fm05-w { margin-left: 0.62ch; }

    /* disk — a wide 1px outline (the counter-image), struck through by a hairline */
    [id="05-forensics-mode-diskwrap"] {
      position: relative;
      width: 22cqw;
      height: 5cqw;
      will-change: transform, opacity;
    }
    [id="05-forensics-mode-disk"] {
      position: absolute;
      inset: 0;
      border: 1px solid #3E4547;
    }
    [id="05-forensics-mode-strike"] {
      position: absolute;
      left: -2cqw;
      top: 0;
      width: 26cqw;
      height: 5cqw;
      overflow: visible;
      display: block;
    }
    [id="05-forensics-mode-strike"] line {
      fill: none;
      stroke: #8A9194;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      stroke-linecap: butt;
    }
  </style>

  <div id="root" data-composition-id="05-forensics-mode" data-width="1920" data-height="1080">

    <!-- ground -->
    <div id="05-forensics-mode-ground" class="clip" data-start="0" data-duration="2" data-track-index="0"></div>

    <!-- front plane -->
    <div id="05-forensics-mode-front" class="clip" data-start="0" data-duration="2" data-track-index="1">
      <div id="05-forensics-mode-cam">

        <div id="05-forensics-mode-kicker"><span class="fm05-w">Forensics</span><span class="fm05-w">Mode</span></div>

        <div id="05-forensics-mode-col">

          <div id="05-forensics-mode-cells">
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
            <div class="fm05-cell"><div class="fm05-fill"></div></div>
          </div>

          <div id="05-forensics-mode-label"><span class="fm05-w">RAM-only</span><span class="fm05-w">boot</span></div>

          <div id="05-forensics-mode-diskwrap">
            <div id="05-forensics-mode-disk"></div>
            <svg id="05-forensics-mode-strike" viewBox="0 0 520 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <!-- −8° hairline: rises left→right across the outline, overhanging 2cqw each side -->
              <line id="05-forensics-mode-strike-line" x1="0" y1="86.5" x2="520" y2="13.5" />
            </svg>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "05-forensics-mode";
      var byId = function (s) { return document.getElementById(ID + "-" + s); };

      var cam       = byId("cam");
      var kicker    = byId("kicker");
      var kickerW   = kicker.querySelectorAll(".fm05-w");
      var cells     = byId("cells").querySelectorAll(".fm05-cell");
      var fills     = byId("cells").querySelectorAll(".fm05-fill");
      var labelW    = byId("label").querySelectorAll(".fm05-w");
      var diskwrap  = byId("diskwrap");
      var disk      = byId("disk");
      var strike    = byId("strike-line");

      // svg-path-draw: measure the strike, never guess it
      var LEN = 525.1;
      try { var m = strike.getTotalLength(); if (m && isFinite(m) && m > 0) LEN = m; } catch (e) {}
      LEN = LEN * 1.02;
      strike.style.strokeDasharray = String(LEN);
      strike.style.strokeDashoffset = String(LEN);

      var tl = gsap.timeline({ paused: true });

      /* ── camera: one lateral pan, x 0 → −1.5% of width, end-to-end, never restarting ── */
      tl.fromTo(cam, { xPercent: 0 }, { xPercent: -1.5, duration: 2.0, ease: "power3.inOut" }, 0);

      /* ── Scene 1 (0.0–0.3s): kicker rises top-left; the empty cells are already seated (unlit) ── */
      tl.fromTo(kickerW,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.06 },
        0);

      /* ── Scene 2 (0.3–1.3s): cells tick cyan left→right, one fill every 0.12s (stat-bars-and-fills, scaleX form) ── */
      var T_FIRST = 0.3, STEP = 0.12;
      tl.fromTo(fills,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.26, ease: "power3.out", stagger: STEP },
        T_FIRST);
      // the lit cell's outline lifts from hint to muted so the row reads as filling, not just marked
      tl.to(cells, { borderColor: "#8A9194", duration: 0.26, ease: "power3.out", stagger: STEP }, T_FIRST);
      // the kicker settles to hint-grey as the first cell lights — cyan stays one element
      tl.to(kickerW, { color: "#3E4547", duration: 0.28, ease: "power3.inOut" }, T_FIRST);

      /* ── Scene 3 (0.9–1.3s): "RAM-only boot" rises beneath the row ── */
      tl.fromTo(labelW,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 },
        0.9);

      /* ── Scene 4 (1.2–1.8s): the disk outline arrives, is struck through at −8°, and fades to 20% ── */
      tl.fromTo(diskwrap,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
        1.0);
      tl.to(strike, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 1.2);
      tl.to(disk, { opacity: 0.2, duration: 0.5, ease: "power3.inOut" }, 1.3);

      /* ── Scene 5 (1.8–2.0s): runs into the cut under the camera pan — no hold, no exit ── */

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
</template>
