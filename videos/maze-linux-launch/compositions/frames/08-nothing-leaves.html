<template>
  <style>
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 400;
      font-style: normal;
      src: url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 500;
      font-style: normal;
      src: url("assets/fonts/JetBrainsMono-500.woff2") format("woff2");
    }

    /* Root styled via #root only (lint: subcomposition_root_styled_by_class). No ground on the root. */
    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "JetBrains Mono", monospace;
      color: #ffffff;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* Track 0 — full-bleed OLED ground */
    .nl08-ground {
      background: #000000;
    }

    /* Track 1 — back plane: blurred, scaled grid (07→08→09 continuous element).
       CSS transform lives on the wrapper; GSAP translates the inner lines element only. */
    .nl08-grid-back {
      overflow: hidden;
      filter: blur(8px);
      transform: scale(1.04);
      opacity: 0.35;
    }
    .nl08-grid-lines {
      position: absolute;
      inset: -308px; /* 2 × 154px — lines sit on frame (0,0) before the offset is applied */
      background-image:
        linear-gradient(#1a2022 1px, transparent 1px),
        linear-gradient(90deg, #1a2022 1px, transparent 1px);
      background-size: 154px 154px;
      background-position: 0 0;
    }

    /* Track 2 — front plane under the camera breath (scale 1.00 → 1.03) */
    .nl08-cam {
      transform-origin: 50% 50%;
    }

    /* The machine: 46cqw × 26cqw outline, dead centre (per the confirmed sketch) */
    .nl08-square {
      position: absolute;
      left: 27cqw;
      top: calc(50% - 13cqw);
      width: 46cqw;
      height: 26cqw;
    }
    .nl08-outline {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }
    .nl08-outline path {
      fill: none;
      stroke: #8a9194;
      stroke-width: 1;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    /* Four names — label role, top-left inside the square */
    .nl08-names {
      position: absolute;
      left: 3cqw;
      top: 2.4cqw;
      font-size: 1.1cqw;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.9;
      white-space: nowrap;
    }
    .nl08-name {
      display: block;
      color: #ffffff;
    }

    /* Thesis line — quote-text role (400, −0.02em), stepped down to fit the square's measure */
    .nl08-thesis {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5cqw;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      white-space: nowrap;
      color: #ffffff;
    }
    .nl08-word {
      display: inline-block;
    }

    /* The frame's one cyan element — the 36×2 rule stub beneath the thesis */
    .nl08-rule {
      position: absolute;
      left: 50%;
      top: calc(50% + 2.6cqw);
      margin-left: -18px;
      width: 36px;
      height: 2px;
      background: #00e5ff;
      transform-origin: 0% 50%;
    }
  </style>

  <div id="root" data-composition-id="08-nothing-leaves" data-width="1920" data-height="1080">
    <div class="clip nl08-ground" data-start="0" data-duration="3.4" data-track-index="0"></div>

    <div class="clip nl08-grid-back" data-start="0" data-duration="3.4" data-track-index="1">
      <div class="nl08-grid-lines" id="nl08-grid-lines"></div>
    </div>

    <div class="clip nl08-cam" id="nl08-cam" data-start="0" data-duration="3.4" data-track-index="2">
      <div class="nl08-square">
        <svg class="nl08-outline" viewBox="0 0 883.2 499.2" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path id="nl08-outline-path" d="M 0.5 0.5 H 882.7 V 498.7 H 0.5 Z" />
        </svg>

        <div class="nl08-names">
          <span class="nl08-name" id="nl08-name-1">HAZE PROTOCOL</span>
          <span class="nl08-name" id="nl08-name-2">HAZEDROP</span>
          <span class="nl08-name" id="nl08-name-3">ENTROPY SHIELD</span>
          <span class="nl08-name" id="nl08-name-4">OLLAMA</span>
        </div>

        <div class="nl08-thesis" id="nl08-thesis"><span class="nl08-word">Nothing</span> <span class="nl08-word">leaves</span> <span class="nl08-word">the</span> <span class="nl08-word">machine.</span></div>

        <div class="nl08-rule" id="nl08-rule"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="08-nothing-leaves"]');
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      var gridLines = q("#nl08-grid-lines");
      var cam = q("#nl08-cam");
      var outline = q("#nl08-outline-path");
      var names = qa(".nl08-name");
      var words = qa(".nl08-word");
      var rule = q("#nl08-rule");

      // svg-path-draw: measured perimeter (rect path 882.2 × 498.2 → 2760.8 user units as the fallback)
      var len = 2760.8;
      try {
        var measured = outline.getTotalLength();
        if (measured && isFinite(measured) && measured > 0) len = measured;
      } catch (e) {}
      len = len * 1.02;
      outline.style.strokeDasharray = String(len);
      outline.style.strokeDashoffset = String(len);

      var tl = gsap.timeline({ paused: true });

      // Back plane — handoff contract: grid offset (−36,−36) at 0.0s → (−77,−77) at 3.4s at a constant
      // (−12px/s, −12px/s). Constant velocity is the boundary condition on both seams, so this one
      // tween is ease-less by contract (07 hands it in, 09 carries it out at the same speed).
      tl.fromTo(gridLines, { x: -36, y: -36 }, { x: -77, y: -77, duration: 3.4, ease: "none" }, 0);

      // Camera breath — one push-in end-to-end, 1.00 → 1.03, never restarting.
      tl.fromTo(cam, { scale: 1 }, { scale: 1.03, duration: 3.4, ease: "power3.inOut" }, 0);

      // Scene 1 (0.0–0.5s): the machine draws itself — one continuous stroke from the top-left corner around.
      tl.fromTo(outline, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: "power3.inOut" }, 0);

      // Scene 2 (0.5–1.9s): the four names surface top-left, 0.35s apart — 24px rise + opacity.
      // Each lands white; as the next arrives it settles to hint-grey, so only the newest is white.
      var NAME_STARTS = [0.5, 0.85, 1.2, 1.55];
      names.forEach(function (el, i) {
        tl.fromTo(el, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, NAME_STARTS[i]);
        if (i < names.length - 1) {
          tl.to(el, { color: "#3e4547", duration: 0.3, ease: "power3.inOut" }, NAME_STARTS[i + 1]);
        }
      });

      // Scene 3 (1.9–2.3s): the names clear together.
      tl.to(names, { opacity: 0, duration: 0.4, ease: "power3.inOut" }, 1.9);

      // Scene 4 (2.3–2.9s): the thesis rises into the square's centre — four words 0.06s apart.
      words.forEach(function (el, i) {
        tl.fromTo(el, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 2.3 + i * 0.06);
      });

      // The frame's one cyan element: the rule stub draws beneath the line at 2.7s.
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.inOut" }, 2.7);

      // Scene 5 (2.9–3.4s): held read under the push-in — no exit; the root crossfade into 09 owns it.

      window.__timelines = window.__timelines || {};
      window.__timelines["08-nothing-leaves"] = tl;
    })();
  </script>
</template>
