LABEL arch
TEXT HELP
Boot the Maze Linux install medium on BIOS.
It allows you to install Maze Linux or perform system maintenance.
ENDTEXT
MENU LABEL Maze Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash bgrt_disable logo.nologo lsm=landlock,lockdown,yama,integrity,apparmor,bpf apparmor=1 security=apparmor

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Maze Linux install medium on BIOS with speakup screen reader.
It allows you to install Maze Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Maze Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
