#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = auto

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
# Maze: disable the KDE Plasma Welcome Center autostart WITHOUT removing the
# package. plasma-welcome is a hard dependency of plasma-meta (can't be dropped),
# and its ONLY autostart is the kded module below — it ships no /etc/xdg/autostart
# entry. A kded6rc [Module-*] override proved unreliable (the module id could not
# be pinned across kded versions), so we simply never extract the kded plugin:
# with the .so absent, kded finds no module to autoload and the Welcome Center is
# never triggered on the live ISO or the installed system (unpackfs copies the
# same tree). usr/bin/plasma-welcome and the .desktop stay, so the app is still
# launchable from the menu if wanted.
NoExtract   = usr/lib/qt6/plugins/kf6/kded/kded_plasma_welcome.so

# Misc options
#UseSyslog
Color
# Maze: animated pac-man progress bar — on brand for a "Maze" distro.
ILoveCandy
#NoProgressBar
# We cannot check disk space from within a chroot environment
#CheckSpace
VerbosePkgLists
ParallelDownloads = 15
#DownloadUser = alpm
#DisableSandbox

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#

# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.

# ORDER MATTERS HERE, and not the way people usually assume: pacman resolves a
# package name from the FIRST repo in this file that carries it and NEVER
# compares versions across repos. So whichever of the two Maze repos comes first
# wins outright, even if the other one holds a newer build.
#
# [maze-aur] (./localrepo) is therefore listed FIRST, on purpose: it makes the
# local repo a STAGING AREA. Drop a freshly built package there and the next ISO
# picks it up instead of the published one, so a new version can be tested in a
# real ISO before it is pushed to the public repo. Anything NOT staged locally
# still comes from [mazelinux] as usual.
#
# The flip side: a forgotten stale build in ./localrepo would silently ship in
# place of the published package. build.sh prints every such override in its
# pre-flight ("local repo overrides") so it can never happen unnoticed — read
# that list before every release build.
#
# This file configures the ISO BUILD only (mkarchiso/pacstrap). The live and
# installed systems use airootfs/etc/pacman.conf, which has no [maze-aur] at
# all — so this ordering cannot leak onto a user's machine.

# Maze Linux: local repository for AUR packages that are NOT in [mazelinux] —
# the Microsoft-signed shim and the third-party desktop apps (upscayl-bin, etc.) —
# built in a clean chroot by tools/build-aur.sh, plus anything staged for test.
# Packages are unsigned (built locally) -> Optional TrustAll.
# NOTE: the absolute file:// path is patched at build time by build.sh.
[maze-aur]
SigLevel = Optional TrustAll
Server = file://./localrepo

# Maze Linux: the official published Maze repository. Maze's OWN applications
# (entropy-shield, qlam, maze-guard, hazedrop, haze, linux-chan-ai, sentinai) are
# pulled from here at ISO build time instead of being built locally from the
# AUR. Packages signed with the Maze signing key (mazelinux-keyring).
[mazelinux]
SigLevel = Required DatabaseOptional
Server = https://mazerepo.berkkucukk.com.tr/packages

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
